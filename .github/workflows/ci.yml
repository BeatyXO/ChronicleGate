name: contract-ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install contract tooling
        run: python -m pip install -r requirements.txt
      - name: GenVM lint and SDK validation
        run: genvm-lint check contracts/chronicle_gate.py
      - name: Preflight
        run: python scripts/preflight.py
      - name: Direct Mode tests
        run: pytest tests/direct -v
